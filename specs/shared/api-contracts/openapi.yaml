openapi: 3.1.0
info:
  title: JINFENG API — Node.js Rebuild Specification
  version: "1.0.0"
  description: >
    Target API contract for a brand-new Node.js 22 + TypeScript + Express + Zod backend that
    replaces the legacy Laravel 5.6 application while connecting to the SAME existing Zeabur
    MySQL database (no schema changes). Every operation preserves the original `/api` path,
    HTTP method, request/response field names and types, and business logic, and carries
    `x-source-file` / `x-source-controller` / `x-source-method` extensions pointing at the
    legacy code for verification purposes only — the new project does not need to understand
    Laravel to implement against this spec. `x-confirmation-status` on each operation/schema is
    one of: `CONFIRMED`, `UNCONFIRMED`, `AUTH_REIMPLEMENTATION_REQUIRED`, `KNOWN_LEGACY_ISSUE`.
    See `api-specification.md` for prose detail, `api-business-logic.md` for framework-agnostic
    pseudocode, and `known-legacy-issues.md` for known inconsistencies in the legacy behavior.

    Authentication is being FULLY REDESIGNED for the new project (see `bearerAuth` below) —
    Laravel Passport token generation/validation/storage is explicitly OUT OF SCOPE and is not
    described anywhere in this document.
servers:
  - url: https://jinfengv2back.zeabur.app
    description: Production (Zeabur)
  - url: http://localhost:8080
    description: Local Node.js dev server

security: []

tags:
  - name: Public
  - name: Auth
  - name: Admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        The new Node.js project will issue and validate its own bearer tokens (JWT or an
        equivalent Node-native auth library/session strategy — implementation detail of the new
        project, not specified here). This does NOT represent, and is not required to be
        compatible with, the legacy Laravel Passport tokens. See `known-legacy-issues.md` /
        `AUTH_REIMPLEMENTATION_REQUIRED`.

  schemas:
    ErrorMessage:
      type: object
      description: Generic error shape used by most controllers (not FormRequest validation errors).
      properties:
        message:
          type: string
      required: [message]
      x-confirmation-status: CONFIRMED

    ValidationError:
      type: object
      description: >
        Shape returned by App\Http\Requests\APIRequest::failedValidation() for every
        FormRequest-based endpoint (register, contact store, contact-class store/update).
        HTTP status is always 400 (not Laravel's default 422).
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
          description: The FIRST validation error message only (Laravel $validator->errors()->first()), in Traditional Chinese.
      required: [status, message]
      x-source-file: app/Http/Requests/APIRequest.php
      x-confirmation-status: CONFIRMED

    LegacyValidationError:
      type: object
      description: >
        Documentation supplement (not a change to the original spec — see 統一錯誤格式 in
        api-specification.md and known-legacy-issues.md #4): Laravel's default inline-validator
        format used specifically by POST /api/v2/auth/login's request validation. The Node.js
        project's 001-auth-login feature (spec.md OD-1, Option B) deliberately reproduces this
        legacy shape for this one endpoint only, instead of the project's own general unified
        error envelope, to preserve existing frontend compatibility.
      properties:
        message:
          type: string
          enum: ["The given data was invalid."]
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
      required: [message, errors]
      x-confirmation-status: CONFIRMED

    PaginatedResponse:
      type: object
      description: Standard Laravel 5.6 paginator (paginate(10)) envelope.
      properties:
        current_page: { type: integer }
        data: { type: array, items: {} }
        first_page_url: { type: string }
        from: { type: [integer, "null"] }
        last_page: { type: integer }
        last_page_url: { type: string }
        links:
          type: array
          items:
            type: object
            properties:
              url: { type: [string, "null"] }
              label: { type: string }
              active: { type: boolean }
        next_page_url: { type: [string, "null"] }
        path: { type: string }
        per_page: { type: integer }
        prev_page_url: { type: [string, "null"] }
        to: { type: [integer, "null"] }
        total: { type: integer }
      x-confirmation-status: CONFIRMED

    Seo:
      type: object
      description: Full `seo` table row (SeoModel only guards a subset via $fillable; reads return all columns).
      properties:
        id: { type: integer }
        class_id: { type: [integer, "null"] }
        relate_id: { type: integer }
        tag: { type: string }
        name: { type: string }
        title: { type: string }
        description: { type: string }
        url: { type: string }
        type: { type: string }
        keyword: { type: string }
        pic: { type: string }
        pic_alt: { type: string }
        del: { type: integer, description: "manual soft-delete flag (0/1), not Eloquent SoftDeletes" }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
      x-source-file: app/Models/SeoModel.php
      x-confirmation-status: CONFIRMED

    ContactClass:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        "no": { type: integer }
        del: { type: integer }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
      required: [id, name, "no", del]
      x-source-file: app/Models/ContactClassModel.php
      x-confirmation-status: CONFIRMED

    ContactQuest:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        "no": { type: integer }
        del: { type: integer }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
      required: [id, name, "no", del]
      x-source-file: app/Models/ContactQuestModel.php
      x-confirmation-status: CONFIRMED

    Faq:
      type: object
      description: FAQController@index projects only these 4 columns out of the full `faq` table; del is NOT filtered — see known-legacy-issues.md.
      properties:
        id: { type: integer }
        name: { type: string }
        info: { type: string }
        "no": { type: integer }
      required: [id, name, info, "no"]
      x-source-file: app/Http/Controllers/Contact/FAQController.php
      x-confirmation-status: CONFIRMED

    ContactListItemInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        job: { type: string, nullable: true }
        cel: { type: string, maxLength: 10 }
      required: [name, email, cel]
      x-source-file: app/Http/Requests/CreateContactRequest.php
      x-confirmation-status: CONFIRMED

    ContactList:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        cel: { type: [string, "null"] }
        job: { type: [string, "null"] }
        email: { type: [string, "null"] }
        "no": { type: integer }
        cid: { type: integer, description: "FK to contact.id — NOT enforced at DB level (contact_list is MyISAM)." }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
      x-source-file: app/Models/ContactListModel.php
      x-confirmation-status: CONFIRMED

    ContactCreateRequest:
      type: object
      description: FormRequest CreateContactRequest — used for both POST /api/v2/contact (store) and PUT /api/v2/admin/contact/{id} (update, see x-confirmation-status UNCONFIRMED note).
      properties:
        class: { type: string }
        quest: { type: string }
        company: { type: string }
        tel: { type: string, maxLength: 10 }
        num: { type: string }
        last5: { type: string, maxLength: 5, nullable: true }
        ticket: { type: string, enum: ["2", "3"], nullable: true }
        ticket_name: { type: string, nullable: true }
        ticket_no: { type: string, nullable: true }
        ticket_address: { type: string, nullable: true }
        from: { type: string, nullable: true }
        suggest_name: { type: string, nullable: true }
        contactList:
          type: array
          items:
            $ref: "#/components/schemas/ContactListItemInput"
      required: [class, quest, company, tel, num, contactList]
      x-source-file: app/Http/Requests/CreateContactRequest.php
      x-confirmation-status: CONFIRMED

    Contact:
      type: object
      properties:
        id: { type: integer }
        class: { type: string }
        quest: { type: string }
        company: { type: string }
        tel: { type: string }
        num: { type: string }
        last5: { type: [string, "null"] }
        ticket: { type: [string, "null"] }
        ticket_name: { type: [string, "null"] }
        ticket_no: { type: [string, "null"] }
        ticket_address: { type: [string, "null"] }
        from: { type: [string, "null"] }
        suggest_name: { type: [string, "null"] }
        del: { type: integer }
        "no": { type: integer }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        contact_list:
          type: array
          items: { $ref: "#/components/schemas/ContactList" }
          description: >
            Only present when loaded via GET /api/v2/admin/contact/{id}. Field name is
            snake_case (not the `contactList()` Eloquent relation method name) — this reflects
            Laravel Eloquent's default relation serialization, confirmed against the actual
            frontend contract (frontend/api/interface/signedUpClass.ts's ContactListData and
            pages/admin/contact/[id].vue both read `contact_list`). A prior revision of this
            schema had `contactList` (camelCase), which was a documentation error, not a
            deliberate contract choice — see specs/backend/laravel-to-node-parity.md §11.1 #10.
      x-source-file: app/Models/ContactModel.php
      x-confirmation-status: CONFIRMED

    ContactClassCreateRequest:
      type: object
      properties:
        name: { type: string }
        "no": { type: integer }
      required: [name, "no"]
      x-source-file: app/Http/Requests/CreateContactClassRequest.php
      x-confirmation-status: CONFIRMED

    FaqWriteRequest:
      type: object
      description: >
        Shared by POST /admin/faq and PUT /admin/faq/{id}. New Node/Admin
        feature — there is no Laravel FormRequest to source this from (no
        confirmed legacy admin FAQ API exists at all; see
        specs/backend/laravel-to-node-parity.md). Modeled on the confirmed
        ContactClassCreateRequest pattern.
      properties:
        name: { type: string }
        info: { type: string }
        "no": { type: integer }
      required: [name, info, "no"]
      x-confirmation-status: NEW_NODE_FEATURE

    Carousel:
      type: object
      description: >
        Admin-facing representation of a homepage carousel slide. New Node/Admin feature, no
        legacy table or contract to mirror — field names are camelCase (unlike Contact/Faq,
        which mirror Laravel Eloquent's snake_case JSON) per this feature's own requirements.
        Each slide carries TWO independent images (desktop 1920x1080 16:9, mobile 700x800
        7:8) — one carousel row, not two — the frontend picks the right one via a CSS
        <picture> breakpoint (max-width: 767px), not a separate carousel entry per device.
      properties:
        id: { type: integer }
        title: { type: string }
        desktopImageKey: { type: string, description: "Backend-generated S3 object key, e.g. carousel/desktop/{uuid}.webp — never client-supplied." }
        desktopImageUrl: { type: string, format: uri, description: "CloudFront URL, derived server-side from AWS_S3_PUBLIC_BASE_URL + desktopImageKey." }
        mobileImageKey: { type: string, description: "Backend-generated S3 object key, e.g. carousel/mobile/{uuid}.webp — never client-supplied." }
        mobileImageUrl: { type: string, format: uri, description: "CloudFront URL, derived server-side from AWS_S3_PUBLIC_BASE_URL + mobileImageKey." }
        linkType: { type: string, enum: [internal, external, none] }
        linkUrl: { type: [string, "null"] }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, title, desktopImageKey, desktopImageUrl, mobileImageKey, mobileImageUrl, linkType, linkUrl, sortOrder, isActive, createdAt, updatedAt]
      x-confirmation-status: NEW_NODE_FEATURE

    PublicCarousel:
      type: object
      description: >
        Public homepage projection — only the fields the frontend carousel actually renders.
        Never exposes desktopImageKey/mobileImageKey (S3 object keys are an admin/backend
        concern only).
      properties:
        id: { type: integer }
        title: { type: string }
        desktopImageUrl: { type: string, format: uri }
        mobileImageUrl: { type: string, format: uri }
        linkType: { type: string, enum: [internal, external, none] }
        linkUrl: { type: [string, "null"] }
        sortOrder: { type: integer }
        isActive: { type: boolean, description: "Always true in practice — the query already filters is_active=1 — but included for parity with the admin shape." }
      required: [id, title, desktopImageUrl, mobileImageUrl, linkType, linkUrl, sortOrder, isActive]
      x-confirmation-status: NEW_NODE_FEATURE

    CarouselWriteRequest:
      type: object
      description: >
        Shared by POST /admin/carousels and PUT /admin/carousels/{id}. New Node/Admin
        feature. Only *ImageKey is accepted — never *ImageUrl — the public URL is always
        derived server-side from AWS_S3_PUBLIC_BASE_URL + key, so a client can never make
        the stored URL point somewhere it doesn't control. Both desktop and mobile keys are
        required on every write, including update: to keep an image unchanged on edit, the
        caller resends that image's existing key; to replace one, it resends a fresh key
        obtained from POST /admin/carousels/upload-url.
      properties:
        title: { type: string }
        desktopImageKey: { type: string }
        mobileImageKey: { type: string }
        linkType: { type: string, enum: [internal, external, none] }
        linkUrl: { type: [string, "null"], description: "Required and must start with '/' when linkType=internal; required and must start with http(s):// when linkType=external; ignored/null when linkType=none." }
        sortOrder: { type: integer }
        isActive: { type: boolean }
      required: [title, desktopImageKey, mobileImageKey, linkType, sortOrder, isActive]
      x-confirmation-status: NEW_NODE_FEATURE

    CarouselUploadUrlRequest:
      type: object
      description: >
        Requests a short-lived (5 minute) presigned S3 PUT URL. fileSize is not part of the
        minimal "what to upload" contract but is required so the server can bind
        ContentLength into the presigned request — the only way to actually enforce the 5MB
        cap given a plain presigned PUT (as opposed to a presigned POST with policy
        conditions). variant picks the S3 key prefix (carousel/desktop/... vs
        carousel/mobile/...), both still under carousel/* so the existing IAM policy
        (arn:aws:s3:::<bucket>/carousel/*) covers both without change.
      properties:
        fileName: { type: string, description: "Informational only — never used to derive the S3 key or path." }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        fileSize: { type: integer, maximum: 5242880, description: "Bytes. Max 5MB (5 * 1024 * 1024)." }
        variant: { type: string, enum: [desktop, mobile] }
      required: [fileName, contentType, fileSize, variant]
      x-confirmation-status: NEW_NODE_FEATURE

    CarouselUploadUrlResponse:
      type: object
      properties:
        uploadUrl: { type: string, format: uri, description: "Presigned S3 PUT URL, expires in 5 minutes." }
        imageKey: { type: string }
        imageUrl: { type: string, format: uri, description: "Final public URL once the PUT completes." }
      required: [uploadUrl, imageKey, imageUrl]
      x-confirmation-status: NEW_NODE_FEATURE

    RegisterRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        password_confirmation: { type: string, description: "required by Laravel 'confirmed' rule; not persisted" }
        is_admin: { type: boolean }
      required: [name, email, password, password_confirmation]
      x-source-file: app/Http/Requests/CreateUser.php
      x-confirmation-status: CONFIRMED

    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
      required: [email, password]
      x-source-file: app/Http/Controllers/Auth/AuthController.php
      x-confirmation-status: CONFIRMED

    LoginResponse:
      type: object
      description: >
        Field name `token` is preserved because the existing frontend depends on it.
        Token implementation must be replaced by the new Node.js authentication system —
        do not attempt to produce or validate a Laravel Passport token here.
      properties:
        token:
          type: string
          description: >
            Opaque bearer token string. In the legacy system this was a Laravel Passport
            token; in the new system it is whatever the new Node.js auth implementation issues
            (e.g. a JWT). The new project only needs to preserve the field NAME and its use as
            a Bearer token — not the legacy token format or validation logic.
      required: [token]
      x-confirmation-status: AUTH_REIMPLEMENTATION_REQUIRED

    DeleteByIdsRequest:
      type: object
      description: >
        Accepts either a single integer or an array of integers under `ids` — the controller
        branches on is_array(). Modeled here as the array form; a bare integer is also accepted
        by the live API (x-confirmation-status: UNCONFIRMED shape — no strict validation in Laravel).
      properties:
        ids:
          oneOf:
            - type: integer
            - type: array
              items: { type: integer }
      required: [ids]
      x-confirmation-status: UNCONFIRMED

paths:
  /api/v2/seo:
    get:
      operationId: getSeoList
      summary: 取得所有 SEO 資料
      tags: [Public]
      x-source-file: app/Http/Controllers/SeoController.php
      x-source-controller: SeoController
      x-source-method: index
      x-confirmation-status: CONFIRMED
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Seo" }
              example:
                - id: 1
                  relate_id: 0
                  tag: "home"
                  name: "首頁"
                  title: "金豐"
                  description: "金豐企業管理顧問股份有限公司"
                  url: "/"
                  type: "website"
                  keyword: "企業管理顧問,金豐"
                  pic: "seo.jpg"
                  pic_alt: "金豐"
                  del: 0
                  created_at: "2024-06-25T00:00:00Z"
                  updated_at: "2024-06-25T00:00:00Z"

  /api/v2/contact-class:
    get:
      operationId: getContactClassList
      summary: 取得所有課程分類（未刪除）
      tags: [Public]
      x-source-file: app/Http/Controllers/Contact/ContactClassController.php
      x-source-controller: Contact\ContactClassController
      x-source-method: index
      x-confirmation-status: CONFIRMED
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContactClass" }
              example:
                - { id: 1, name: "勞資爭議", "no": 10, del: 0, created_at: "2024-06-25T00:00:00Z", updated_at: "2024-06-25T00:00:00Z" }

  /api/v2/contact-quest:
    get:
      operationId: getContactQuestList
      summary: 取得所有問題選項（未刪除，分頁）
      tags: [Public]
      x-source-file: app/Http/Controllers/Contact/ContactQuestController.php
      x-source-controller: Contact\ContactQuestController
      x-source-method: index
      x-confirmation-status: CONFIRMED
      responses:
        "200":
          description: OK (Laravel paginator envelope)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedResponse" }

  /api/v2/contact:
    post:
      operationId: createContact
      summary: 送出報名表單
      tags: [Public]
      x-source-file: app/Http/Controllers/Contact/ContactController.php
      x-source-controller: Contact\ContactController
      x-source-method: store
      x-confirmation-status: CONFIRMED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactCreateRequest" }
            example:
              class: "勞資爭議講座"
              quest: "想了解資遣費計算"
              company: "測試股份有限公司"
              tel: "0212345678"
              num: "2"
              contactList:
                - { name: "王小明", email: "test@example.com", job: "經理", cel: "0912345678" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "新增成功" }
                  data: { $ref: "#/components/schemas/Contact" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /api/v2/faq:
    get:
      operationId: getFaqList
      summary: 取得所有 FAQ（24 小時快取，投影 4 欄位，未過濾 del）
      tags: [Public]
      x-source-file: app/Http/Controllers/Contact/FAQController.php
      x-source-controller: Contact\FAQController
      x-source-method: index
      x-confirmation-status: UNCONFIRMED
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Faq" }

  /api/v2/admin/faq:
    get:
      operationId: adminListFaq
      summary: 管理端：取得所有 FAQ（新 Node/Admin 功能，非 Laravel legacy parity）
      description: >
        No confirmed legacy admin FAQ API exists — see
        specs/backend/laravel-to-node-parity.md. Same 4-column
        projection/ordering as the public GET /faq (no del filter). No
        active cache layer sits in front of this table, so a write here is
        visible on the next public GET /faq immediately.
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      x-confirmation-status: NEW_NODE_FEATURE
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Faq" }
    post:
      operationId: adminCreateFaq
      summary: 管理端：新增 FAQ（新 Node/Admin 功能）
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      x-confirmation-status: NEW_NODE_FEATURE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FaqWriteRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "新增成功" }
                  data: { $ref: "#/components/schemas/Faq" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
    delete:
      operationId: adminDeleteFaq
      summary: 管理端：刪除 FAQ（單筆或批次，硬刪除；新 Node/Admin 功能）
      description: >
        Hard delete (real DELETE, not del=1) — matches the implemented
        precedent for the same table family (contact_class; see
        known-legacy-issues.md #10). No confirmed legacy FAQ admin delete
        contract exists to contradict this.
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      x-confirmation-status: NEW_NODE_FEATURE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteByIdsRequest" }
      responses:
        "200":
          description: 刪除成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: 部分或全部 id 不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /api/v2/admin/faq/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      operationId: adminUpdateFaq
      summary: 管理端：更新 FAQ（新 Node/Admin 功能）
      description: >
        Allows changing name/info/no only — id and del are never written.
        404 if the id does not exist.
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      x-confirmation-status: NEW_NODE_FEATURE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FaqWriteRequest" }
      responses:
        "200":
          description: 更新成功
          content:
