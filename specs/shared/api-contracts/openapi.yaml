  /api/v2/admin/carousels/upload-url:
    post:
      operationId: adminCreateCarouselUploadUrl
      summary: 管理端：取得輪播圖片的 S3 Presigned Upload URL
      description: >
        Backend generates the S3 object key from `variant` (carousel/desktop/{uuid}.ext or
        carousel/mobile/{uuid}.ext) — the client-supplied fileName is informational only and
        is never used as or to derive the key/path. contentType is restricted to
        image/jpeg, image/png, image/webp. fileSize is validated against a 5MB cap and bound
        into the presigned request's ContentLength so S3 itself rejects a PUT that doesn't
        match. The presigned uploadUrl is signed directly against S3 (not routed through
        CloudFront, which only serves reads) and expires in 5 minutes.
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      x-confirmation-status: NEW_NODE_FEATURE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CarouselUploadUrlRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarouselUploadUrlResponse" }
        "400":
          description: Validation error (unsupported contentType, fileSize over 5MB, etc.)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "503":
          description: AWS S3 not configured on this environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /api/v2/admin/carousels/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      operationId: adminUpdateCarousel
      summary: 管理端：更新輪播圖
      description: >
        desktopImageKey/mobileImageKey are diffed independently against the existing row: for
        whichever image actually changed, the OLD S3 object is deleted only after this DB
        update succeeds (never before) — a failure to delete an old image is logged but does
        not fail this request, since the DB write (the source of truth) has already
        committed. To keep an image unchanged, resend its existing key.
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      x-confirmation-status: NEW_NODE_FEATURE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CarouselWriteRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "更新成功" }
                  data: { $ref: "#/components/schemas/Carousel" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "404":
          description: 找不到資料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
    delete:
      operationId: adminDeleteCarousel
      summary: 管理端：刪除輪播圖（單筆，非批次；與 FAQ/contact-class 的批次 delete 慣例不同）
      description: >
        Deliberately single-id (path param), unlike FAQ/contact-class's batch `DELETE /` with
        a body {ids}. Deletion is coupled to BOTH S3 objects (read record -> delete desktop
        object -> delete mobile object -> delete DB row, in that order): a genuine S3 delete
        failure on either image (not simply "object already missing", which S3 treats as a
        success) returns 500 and leaves the DB row untouched, so there is never a DB row
        pointing at a deleted image nor a deleted row whose image might still exist. If
        desktop deletes but mobile then fails, a retry is safe — re-deleting the already-gone
        desktop key is a no-op.
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      x-confirmation-status: NEW_NODE_FEATURE
      responses:
        "200":
          description: 刪除成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: 找不到資料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "500":
          description: S3 刪除失敗，DB 未變更
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "503":
          description: AWS S3 not configured on this environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
